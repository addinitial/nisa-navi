<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- 背景（角丸正方形） -->
  <rect width="400" height="400" rx="88" fill="url(#bg)"/>

  <!-- 光沢 -->
  <rect width="400" height="200" rx="88" fill="url(#shine)"/>

  <!-- N の文字 -->
  <text x="200" y="252"
    font-family="Arial Black, sans-serif"
    font-size="200"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-8">N</text>

  <!-- 下部の小さいテキスト -->
  <text x="200" y="320"
    font-family="Arial, sans-serif"
    font-size="36"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    opacity="0.85">NAVI</text>

  <!-- 右上の小さいチャートアイコン -->
  <g transform="translate(270, 60)" opacity="0.6">
    <rect x="0" y="30" width="14" height="20" rx="3" fill="white"/>
    <rect x="20" y="16" width="14" height="34" rx="3" fill="white"/>
    <rect x="40" y="4" width="14" height="46" rx="3" fill="white"/>
    <polyline points="7,28 27,14 47,2" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
